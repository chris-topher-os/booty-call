<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>booty-call</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1.5rem;
  font: 15px/1.4 system-ui, sans-serif;
  background: #111418; color: #dfe3e8;
  display: flex; justify-content: center;
}
main { width: 100%; max-width: 420px; }
h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1.25rem; letter-spacing: 0.04em; }
.box { margin-bottom: 1.5rem; }
.box-title { font-size: 0.85rem; color: #8b949e; margin: 0 0 0.5rem; text-transform: uppercase; letter-spacing: 0.06em; }
.node {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.65rem 0.8rem; margin-bottom: 0.4rem;
  border: 1px solid #2b323b; border-radius: 10px;
  cursor: pointer; user-select: none;
  background: #171b21;
  transition: border-color 0.15s, background 0.15s;
}
.node input { accent-color: #5ec7ff; margin: 0; }
.node:has(input:enabled):hover { border-color: #5ec7ff66; }
.node:has(input:disabled) { cursor: default; opacity: 0.75; }
.node .label { flex: 1; }
.node .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
.node.online { border-color: #2ea04366; }
.node.online .dot { background: #3fb950; }
.node.online .label::after { content: "active"; color: #3fb950; font-size: 0.8em; margin-left: 0.4em; }
.node.switching-target { border-color: #d2992266; }
.node.switching-target .dot { background: #d29922; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.status { min-height: 1.3em; font-size: 0.85rem; color: #8b949e; margin-top: 0.3rem; }
.status.stuck { color: #f85149; }
.status.switching { color: #d29922; }
#login { text-align: center; margin-top: 3rem; display: none; }
#login input {
  width: 220px; padding: 0.55rem; font-size: 1rem;
  background: #171b21; color: #dfe3e8;
  border: 1px solid #2b323b; border-radius: 8px;
}
#login button, #logout {
  background: #2b323b; color: #dfe3e8; border: none;
  padding: 0.55rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
}
#logout { background: none; color: #8b949e; font-size: 0.75rem; padding: 0.2rem; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>booty-call</h1>
    <button id="logout" style="display:none">sign out</button>
  </header>
  <div id="login">
    <p>Enter the booty-call API token.</p>
    <input type="password" id="token-input" placeholder="token" autocomplete="off">
    <br><br>
    <button id="login-btn">sign in</button>
  </div>
  <div id="boxes" style="display:none"></div>
</main>
<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
