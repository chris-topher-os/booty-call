[workspace]
resolver = "2"
members = ["crates/common", "crates/agent", "crates/control"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
common = { path = "crates/common" }
include_dir = "0.7"

[profile.release]
lto = true
strip = true
